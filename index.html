<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Love You Sanjana</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Dancing Script', cursive;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            transition: background 0.5s ease;
        }
        .container {
            text-align: center;
            animation: fadeIn 2s ease-in-out;
            position: relative;
            z-index: 10;
        }
        h1 {
            font-size: 4em;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3), 0 0 20px rgba(255,255,255,0.5);
            animation: bounce 1s infinite alternate, glow 2s ease-in-out infinite alternate;
            margin-bottom: 20px;
        }
        .subtitle {
            font-size: 2em;
            color: #fff;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
            animation: fadeIn 3s ease-in-out 2s both;
            opacity: 0;
        }
        .hearts {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }
        .heart {
            position: absolute;
            color: #ff69b4;
            font-size: 2em;
            animation: float 6s linear infinite;
        }
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            top: -10px;
            animation: fall 3s linear forwards;
            z-index: 5;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }
        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
        }
        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }
        @keyframes glow {
            from { text-shadow: 2px 2px 4px rgba(0,0,0,0.3), 0 0 20px rgba(255,255,255,0.5); }
            to { text-shadow: 2px 2px 4px rgba(0,0,0,0.3), 0 0 30px rgba(255,255,255,0.8); }
        }
        .pulse {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="hearts" id="hearts"></div>
    <div class="container pulse">
        <h1 id="mainMessage"></h1>
        <div class="subtitle">Forever Yours 💕</div>
    </div>
    <script>
        // Typewriter effect for the main message
        const text = "I Love You Sanjana ❤️";
        let index = 0;
        const h1 = document.getElementById('mainMessage');
        function typeWriter() {
            if (index < text.length) {
                h1.textContent += text.charAt(index);
                index++;
                setTimeout(typeWriter, 150);
            }
        }
        typeWriter();

        // Create floating hearts
        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart';
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 3 + 's';
            document.getElementById('hearts').appendChild(heart);
            setTimeout(() => {
                heart.remove();
            }, 6000);
        }
        setInterval(createHeart, 300);

        // Confetti effect on click
        function createConfetti() {
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.animationDelay = Math.random() * 2 + 's';
                confetti.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 50%)`;
                document.body.appendChild(confetti);
                setTimeout(() => {
                    confetti.remove();
                }, 3000);
            }
        }

        // Add click event to the container for confetti
        document.querySelector('.container').addEventListener('click', createConfetti);

        // Hidden message reveal on double-click
        let clickCount = 0;
        document.querySelector('.container').addEventListener('dblclick', () => {
            clickCount++;
            if (clickCount === 2) {
                const message = document.createElement('p');
                message.textContent = "You are my everything, Sanjana! 💕";
                message.style.color = '#fff';
                message.style.fontSize = '1.5em';
                message.style.marginTop = '20px';
                message.style.animation = 'fadeIn 1s';
                message.style.textShadow = '1px 1px 2px rgba(0,0,0,0.3)';
                document.querySelector('.container').appendChild(message);
                setTimeout(() => {
                    message.remove();
                    clickCount = 0;
                }, 5000);
            }
        });

        // Background color change on mouse move
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            document.body.style.background = `linear-gradient(135deg, hsl(${x * 360}, 70%, 80%) 0%, hsl(${y * 360}, 70%, 90%) 100%)`;
        });
    </script>
</body>
</html>
